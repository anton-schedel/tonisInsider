name: scrape-and-deploy

on:
  # Primary trigger: the Cloudflare Worker's cron starts this every 5 minutes via workflow_dispatch
  # (force=false). GitHub's own scheduler is best-effort, so it only runs as a 30-minute backup.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build and deploy even if nothing changed"
        type: boolean
        default: true
  push:
    branches: [main]

# Never run two scrapes at once; queue instead of cancelling (a cancelled run would lose its cache save).
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false # keep the token away from npm dependencies

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck (code changes only)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force)
        run: npm run typecheck

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            store
            public/img
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Restore from our own site if the cache was lost
        run: npm run restore
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Scrape
        id: scrape
        run: npm run scrape
        env:
          # Optional: win chances from The Odds API (free key). Without it the odds are skipped.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      # Our club's banner: LigaInsider's Dortmund stadium photo with our crest swapped in (scripts/club-banner.py).
      # Made here, not committed: the photo is LigaInsider's/Getty's, and the repo holds only code.
      - name: Own post banners
        run: |
          f=public/img/custom/schnoeselmob-banner.jpg
          players="nguyen" # cut-outs in public/brand/, shown on that banner
          missing=$([ -f "$f" ] || echo y; for p in $players; do [ -f "public/img/custom/$p-banner.jpg" ] || echo y; done)
          [ -z "$missing" ] && exit 0
          python3 -m pip install --quiet --user --break-system-packages pillow
          mkdir -p public/img/custom
          if [ ! -f "$f" ]; then
            curl -fsSL -A "Mozilla/5.0" -o "$RUNNER_TEMP/bvb.jpg" "https://cdn.ligainsider.com/ligainsider//newsarticle/tr:w-1200,q-80,fo-top,l-text,i-%C2%A9Getty%20Images%2FLigaInsider,fs-22,co-e3e3e3,rt-270,lx-5,ly-10,l-end/borussia-dortmund-artikelbild-2025-v2.jpg?updatedAt=1758910190729"
            python3 scripts/club-banner.py "$RUNNER_TEMP/bvb.jpg" public/brand/schnoeselmob.png "$f" 0.2 1.48 602 338
          fi
          for p in $players; do
            [ -f "public/img/custom/$p-banner.jpg" ] || python3 scripts/player-images.py "public/brand/$p.png" "$f" "public/img/custom/$p"
          done

      - name: Save data cache
        if: steps.scrape.outputs.save_cache == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            store
            public/img
          key: data-${{ github.run_id }}

      - name: Build
        if: steps.scrape.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force)
        run: npm run build
        # Public by design (it ends up in the page); repo variables so the build can inline them.
        env:
          PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}

      # The site is a Cloudflare Worker (Astro adapter): static pages as assets, /mein-team/ and /api/*
      # rendered on request. The name comes from a repo variable so the URL never appears in this repo.
      - name: Deploy to Cloudflare
        if: steps.scrape.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force)
        run: npx wrangler deploy --config dist/server/wrangler.json --name "${{ vars.CF_PAGES_PROJECT }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Fail if the scraper reported problems (GitHub emails you)
        if: steps.scrape.outputs.problems != '0'
        run: |
          echo "The scraper reported problems; see the Scrape step log. LigaInsider may have changed their HTML."
          exit 1

  # GitHub pauses scheduled workflows in public repos after 60 days without activity.
  # Re-enabling (idempotent) during the midnight-UTC hour resets that timer. Separate job so that
  # only this tiny step, which runs no npm code, holds the actions:write token.
  keep-alive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        run: |
          if [ "$(date -u +%H)" = "00" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scrape.yml/enable" \
              || echo "::warning::keep-alive call failed; will retry next run"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
