name: TonInsider
options:
  bundleIdPrefix: $(BUNDLE_ID_PREFIX)
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.92.0
targets:
  TonInsider:
    type: application
    platform: iOS
    sources: [TonInsider]
    dependencies:
      - package: PostHog
    info:
      path: TonInsider/Info.plist
      properties:
        CFBundleDisplayName: TonInsider
        TISiteURL: $(SITE_URL)
        TIPostHogToken: $(POSTHOG_PROJECT_TOKEN)
        TIPostHogHost: $(POSTHOG_HOST)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Only the local dev server (development); the site itself is https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).toninsider
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  TonInsiderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TonInsiderTests
        excludes: [Fixtures]
      - path: TonInsiderTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: TonInsider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).toninsider.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  TonInsider:
    build:
      targets:
        TonInsider: all
        TonInsiderTests: [test]
    test:
      targets: [TonInsiderTests]
